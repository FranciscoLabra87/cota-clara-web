name: Desplegar a Cloudflare Workers

# Despliegue automático en cada push a main.
#
# Mientras no existan los secretos del repo (Settings > Secrets and variables >
# Actions) este workflow igual compila el sitio, pero se salta el deploy en vez
# de fallar. Hacen falta:
#   CLOUDFLARE_API_TOKEN   token con permiso de editar Workers
#   CLOUDFLARE_ACCOUNT_ID  id de la cuenta de Cloudflare
#
# Y en wrangler.jsonc, el database_id real de la D1.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desplegar:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Enciende HSTS y upgrade-insecure-requests. Las cabeceras se fijan al
      # compilar, así que tiene que estar puesto ya en el build de Next.
      COTA_HSTS: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Antes de compilar: si la suite se cae, no se despliega.
      - name: Pruebas
        run: npm test

      - name: Build de Next
        run: npm run build

      - name: Revisar si hay credenciales de Cloudflare
        id: credenciales
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "listas=si" >> "$GITHUB_OUTPUT"
          else
            echo "listas=no" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy omitido::Falta CLOUDFLARE_API_TOKEN o CLOUDFLARE_ACCOUNT_ID en los secretos del repo."
          fi

      - name: Build y deploy del Worker
        if: steps.credenciales.outputs.listas == 'si'
        run: npx opennextjs-cloudflare build && npx opennextjs-cloudflare deploy
